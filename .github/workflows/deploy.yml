name: Deploy Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  issue_comment:
    types: [ created ] # Listens for chat keywords inside PR conversations

jobs:
  # Gate 0: Code Hygiene (Runs on Draft & Full PRs)
  lint:
    name: "Code Quality"
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: astral-sh/setup-uv@v3

      - name: Install Development Dependencies
        run: uv sync --all-groups
      
      - name: Check for errors & import sorting
        run: uv run ruff check .
        
      - name: Verify formatting
        run: uv run ruff format --check .

  # Gate 1: Python Logic & Math (Runs on Draft & Full PRs)
  python_tests:
    name: "Tests: Unit & Integration"
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          lfs: true # Critical for downloading the .joblib models

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Development Dependencies
        run: uv sync --all-groups

      - name: Run Unit Tests (Mocked)
        run: uv run pytest tests/unit -v --junitxml=unit-test-report.xml

      - name: Run Integration Tests (Model Math Parity)
        run: uv run pytest tests/integration -v --junitxml=integration-test-report.xml

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-reports
          path: |
            unit-test-report.xml
            integration-test-report.xml
          retention-days: 14

  # Gate 2: Static Analysis (Runs on Draft & Full PRs)
  security_scans:
    name: "Security: SAST & SCA"
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          lfs: true 

      - name: Semgrep SAST (Code Scan)
        # ASSESSMENT OVERRIDE: Allowed to log warnings without breaking review apps
        continue-on-error: true
        run: |
          python3 -m pip install semgrep
          echo "=== 1. COMPILING BACKGROUND REPORTS ==="
          semgrep scan --config auto --json --output semgrep.json
          echo "=== 2. RUNNING CONSOLE LOG SAST ANALYSIS ==="
          semgrep scan --config auto --error

      - name: Trivy Filesystem Scan (Dependency Scan)
        uses: aquasecurity/trivy-action@0.35.0
        # ASSESSMENT OVERRIDE: Surfaced for visibility, but continues on error to prevent database update blocks
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          output: 'trivy-fs.txt'
          exit-code: '1' # Kept at 1 so GitHub accurately colors the step red as a visual warning

      - name: Print Trivy Results
        if: always() 
        run: |
          echo "=== 2. SCAN PROCESS COMPLETE! PRINTING RESULTS TO CONSOLE ==="
          if [ -f trivy-fs.txt ]; then
            cat trivy-fs.txt
          else
            echo "Error: trivy-fs.txt was not generated."
          fi

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: security-reports
          path: |
            semgrep.json
            trivy-fs.txt
          retention-days: 14

  # Job 3: Infrastructure (Runs on Non-Draft PRs, Main Merges, and PR /deploy-preview Comments)
  infrastructure:
    name: "Infra: Balance State & Provision"
    needs: [python_tests, security_scans, lint]
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/deploy-preview'))
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.tofu_output.outputs.ecr_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # SELF-HEALING UPDATE: Reviews S3 layout, automatically falls back to run bootstrap if missing
      - name: Verify Backend State Bucket and Auto-Bootstrap
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET_NAME="ml-engineer-exam-tf-state-${ACCOUNT_ID}"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Remote backend infrastructure discovered. Proceeding directly."
          else
            echo "⚠️ Remote OpenTofu backend bucket not found! Bootstrapping layout storage targets..."
            gh workflow run "Manual: Bootstrap TF Backend" --ref ${{ github.ref }}
            echo "Pausing for 60s to allow S3 resource propagation and table locking maps to settle..."
            sleep 60
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Execution Engine
        working-directory: terraform/app
        id: tofu_output
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          tofu init -backend-config="bucket=ml-engineer-exam-tf-state-${ACCOUNT_ID}"
          
          echo "=== 1. ENSURING BASE ECR REGISTRY EXISTS ==="
          tofu apply -target=aws_ecr_repository.app_repo -auto-approve
          
          ECR_URL=$(tofu state show aws_ecr_repository.app_repo | grep repository_url | awk -F '"' '{print $2}')
          echo "ecr_url=${ECR_URL}" >> $GITHUB_OUTPUT
          
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "=== 2. MAIN BRANCH DETECTED: SKIPPING INTERMEDIATE PLAN ==="
          else
            echo "=== 2. ENVIRONMENT FORK/PR DETECTED: GENERATING PREVIEW CHANGELOG ==="
            tofu plan
          fi

  # Job 4: Build, Artifact Scan, and Smoke Test
  build_verify_push:
    name: "Build & Container Verify"
    needs: infrastructure
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_env.outputs.VERSION_OUT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          lfs: true
          fetch-depth: 0 

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bump version and select tag
        id: cz_bump
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
        continue-on-error: true 

      - name: Set Version Env Var
        id: version_env
        env:
          CZ_VERSION: ${{ steps.cz_bump.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "$CZ_VERSION" ]; then
            echo "APP_VERSION=$CZ_VERSION" >> $GITHUB_ENV
            echo "VERSION_OUT=$CZ_VERSION" >> $GITHUB_OUTPUT
          else
            echo "APP_VERSION=$GITHUB_SHA" >> $GITHUB_ENV
            echo "VERSION_OUT=$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if Image Tag Exists in ECR
        id: check_tag
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          if aws ecr describe-images --repository-name ml-engineer-exam --image-ids imageTag="$APP_VERSION" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $APP_VERSION already exists in ECR. Skipping layer builds."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $APP_VERSION is completely new. Proceeding to compilation paths."
          fi
        continue-on-error: true

      - name: Export Lockfile context
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --output-file requirements.txt

      - name: Build Local Test Image Target
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          load: true
          target: test-env
          tags: ${{ needs.infrastructure.outputs.ecr_url }}:${{ env.APP_VERSION }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Image Scan (Scan the test target for fast security coverage)
        uses: aquasecurity/trivy-action@0.35.0
        # ASSESSMENT OVERRIDE: Surfaced for visibility, but continues on error to prevent base layer mutations from stalling builds
        continue-on-error: true
        with:
          image-ref: '${{ needs.infrastructure.outputs.ecr_url }}:${{ env.APP_VERSION }}-test'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          output: 'trivy-image.txt'
          exit-code: '1' # Kept at 1 so GitHub accurately colors the step red as a visual warning

      - name: Print Container Scan Results
        if: always()
        run: |
          if [ -f trivy-image.txt ]; then
            cat trivy-image.txt
          fi

      - name: Upload Container Scan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-report
          path: trivy-image.txt
          retention-days: 14

      - name: Artifact Smoke Test (System Verification)
        env:
          ECR_URL: ${{ needs.infrastructure.outputs.ecr_url }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Starting container emulator for verification workflows..."
          docker run -d --name smoke-test -p 9000:8080 \
            -e ROOT_PATH=/var/task \
            -e APP_NAME=ml_engineer_exam \
            "$ECR_URL:$APP_VERSION-test"
          
          sleep 10
          
          uv run python tests/verify_inference.py --url http://localhost:9000/2015-03-31/functions/function/invocations --model linear
          uv run python tests/verify_inference.py --url http://localhost:9000/2015-03-31/functions/function/invocations --model ridge
          uv run python tests/verify_inference.py --url http://localhost:9000/2015-03-31/functions/function/invocations --model random_forest
          
          echo "All structural model variations passed emulator validation. Cleaning tasks..."
          docker rm -f smoke-test

      - name: Build & Push Production Image to ECR
        env:
          ECR_URL: ${{ needs.infrastructure.outputs.ecr_url }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Compiling pristine runtime production target stage..."
          docker build --target production -t "$ECR_URL:$APP_VERSION" .
          echo "Publishing verified system artifact directly to ECR registry..."
          docker push "$ECR_URL:$APP_VERSION"

  # Job 5: Deploy (Provision and Rollout)
  deploy:
    name: "Deploy: Update Production Lambda"
    needs: [infrastructure, build_verify_push]
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/deploy-preview'))
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.tofu_apply.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Apply (Full Rollout)
        id: tofu_apply
        working-directory: terraform/app
        env:
          IMAGE_TAG: ${{ needs.build_verify_push.outputs.version }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          tofu init -backend-config="bucket=ml-engineer-exam-tf-state-${ACCOUNT_ID}"
          
          echo "=== EXECUTING FINAL STATE SYNCHRONIZATION ==="
          tofu apply -var="container_image_tag=$IMAGE_TAG" -auto-approve
          
          API_URL=$(tofu output -raw api_url)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Surface Live Endpoint Summary
        run: |
          echo "### 🚀 System Scoring Endpoint Live!" >> $GITHUB_STEP_SUMMARY
          echo "The multi-model inference handler container has rolled out smoothly." >> $GITHUB_STEP_SUMMARY
          echo "#### Active Endpoint Target Target URL:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tofu_apply.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Run verification script from terminal using:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "bash src/ml_engineer_exam/scripts/post_deploy.sh ${{ steps.tofu_apply.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Job 6: Final Production Verification (Synthetic Monitoring)
  smoke_test_production:
    name: "Smoke Test: Production API"
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Production Smoke Test
        env:
          API_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          echo "Allowing ~60s for Lambda initialization workspace loop (Lazy-loading all 3 models)..."
          sleep 60
          
          chmod +x ./src/ml_engineer_exam/scripts/post_deploy.sh
          ./src/ml_engineer_exam/scripts/post_deploy.sh "$API_URL"