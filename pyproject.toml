[project]
name = "ml-engineer-exam"
version = "0.3.0"
description = "A sample project for ML engineering exam for Milliman IntelliScript."
requires-python = ">=3.12"
# DEPLOYMENT DEPENDENCIES (The "Weight" of your Lambda)
dependencies = [
    "loguru>=0.7.3",
    "pandas<3.0.0",        # Crucial for MLflow 2.x compatibility
    "pydantic>=2.12.5",
    "pydantic-settings",
    "scikit-learn>=1.6.0", #  1.6 is stable for 2026
    "joblib>=1.5.3",       # Explicitly required for model loading
    "mlflow>=2.11.0",
    "protobuf<5.0.0",
    "wheel"
]

[project.optional-dependencies]
# DEVELOPMENT DEPENDENCIES (Excluded from the Docker Image)
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",         # Required for your CI Linting step
    "boto3>=1.34.0",       # Helpful for local AWS simulation
    "commitizen>=3.27.0",  # Added for conventional commits & versioning
    "pre-commit>=3.7.0"    # Added for local Git hook enforcement
]

[project.scripts]
run_model_training = "ml_engineer_exam.scripts.run_model_training:main"
run_prediction = "ml_engineer_exam.scripts.run_prediction:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# HATCH CONFIG (Replaces the setuptools section)
[tool.hatch.build.targets.wheel]
packages = ["src/ml_engineer_exam"]

# COMMITIZEN CONFIGURATION
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"  # Tells cz to read/write version in [project]
version = "0.3.0"            # Must match [project.version] initially
update_changelog_on_bump = true
major_version_zero = true     # Keeps 0.x.x versioning strict until 1.0.0

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
select = ["I", "E", "W", "F", "B", "N"] 
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ml_engineer_exam"]
combine-as-imports = true